<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#050907">
<title>RADIOLOCATOR 3.0 - MAGNETÔMETRO</title>
<style>
:root{--bg:#050907;--panel:#0b1510;--line:#244436;--text:#e4ffed;--muted:#87ad9b;--accent:#42f58d;--warn:#ffd166;--danger:#ff7f7f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg)}
body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--text)}
main{height:100dvh;min-height:100svh;display:flex;flex-direction:column;padding:calc(9px + env(safe-area-inset-top)) 12px calc(10px + env(safe-area-inset-bottom));gap:9px;max-width:650px;margin:auto}
header{display:flex;align-items:center;justify-content:space-between}
.brand{font:900 13px monospace;letter-spacing:2px;color:var(--accent)}
.timer{font:800 16px monospace;color:var(--muted)}
.mission{text-align:center;color:var(--muted);font-size:11px;letter-spacing:1.3px;font-weight:800}
.detector{flex:1;min-height:0;border:1px solid var(--line);border-radius:24px;background:radial-gradient(circle at 50% 35%,#12301f 0,#09130d 38%,#060a08 78%);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px 16px;position:relative;box-shadow:inset 0 0 45px #0008}
.detector:before{content:"";position:absolute;inset:10px;border:1px solid #173226;border-radius:18px;pointer-events:none}
.label{font:800 11px monospace;letter-spacing:2px;color:var(--muted);margin-bottom:8px}
.reading{font:900 clamp(70px,22vw,140px)/.82 ui-monospace,SFMono-Regular,Consolas,monospace;color:var(--accent);text-shadow:0 0 28px #42f58d66;letter-spacing:-4px}
.unit{font:900 15px monospace;letter-spacing:3px;color:var(--muted);margin-top:6px}
.signal{width:min(92%,430px);margin-top:18px}
.signalbar{height:15px;border:1px solid #2a513e;border-radius:99px;background:#050b07;padding:2px;overflow:hidden}
.signalbar i{display:block;width:5%;height:100%;border-radius:99px;background:var(--accent);box-shadow:0 0 18px #42f58d99;transition:width .2s}
.signaltext{text-align:center;margin-top:8px;height:18px;font-weight:900;font-size:12px;letter-spacing:1.5px;color:var(--warn)}
.clicks{height:40px;margin-top:10px;display:flex;align-items:center;justify-content:center;gap:4px;overflow:hidden;max-width:95%}
.dot{width:4px;height:4px;border-radius:50%;background:var(--accent);opacity:.8;animation:pulse .15s ease-out}
@keyframes pulse{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:.85}}
.info{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;width:100%;max-width:430px;margin-top:10px}
.info div{border:1px solid #1c3328;background:#07100b;border-radius:10px;text-align:center;padding:6px}
.info small{display:block;color:var(--muted);font-size:8px}
.info b{font:800 13px monospace}
.controls{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:7px}
button{appearance:none;border:1px solid #2b5c48;background:#10231a;color:var(--text);border-radius:13px;min-height:48px;font-size:12px;font-weight:900;letter-spacing:.5px;cursor:pointer}
button.primary{background:#1a5037;border-color:var(--accent);box-shadow:0 0 15px #42f58d18}
button:disabled{opacity:.38;cursor:not-allowed}
#calibBtn{background:#18382b;border-color:var(--warn);color:var(--warn)}
@media(max-height:650px){main{gap:5px;padding-top:5px}.detector{padding:10px}.reading{font-size:60px}.signal{margin-top:10px}.clicks{height:28px;margin-top:5px}.info{margin-top:5px}.controls button{min-height:42px}}
</style>
</head>
<body>
<main>
<header><div class="brand">RADIOLOCATOR 3.0 (MAG)</div><div id="timer" class="timer">05:00</div></header>
<div class="mission" id="statusText">VARREDURA MAGNÉTICA REAL ATIVA</div>

<section class="detector">
  <div class="label">DETECTOR VIRTUAL (MAG → CPM)</div>
  <div id="cpm" class="reading">—</div>
  <div class="unit">CPM</div>
  <div class="signal"><div class="signalbar"><i id="bar"></i></div><div id="signalText" class="signaltext">TOQUE EM INICIAR</div></div>
  <div id="clicks" class="clicks"></div>
  <div class="info">
    <div><small>BACKGROUND</small><b id="bgVal">45 µT</b></div>
    <div><small>SENS. MAGNÉTICO</small><b id="uTVal">— µT</b></div>
    <div><small>MÁXIMA</small><b id="max">—</b></div>
  </div>
</section>

<div class="controls">
  <button id="start" class="primary">▶ INICIAR</button>
  <button id="measure" disabled>☢ MEDIR</button>
  <button id="calibBtn">⚙ CALIBRAR</button>
</div>
</main>

<script>
let bgUT = 45; 
let currentUT = bgUT;
let sensorActive = false;
let running = false, startTime = 0, timerInt = null, maxCPM = 0, autoMeasureInt = null;

const $ = id => document.getElementById(id);

function poisson(mean) {
  if (mean <= 0) return 0;
  let L = Math.exp(-mean);
  if (L === 0) {
    let u = 0; for(let i=0; i<12; i++) u += Math.random();
    return Math.max(0, Math.round(mean + Math.sqrt(mean) * (u - 6)));
  }
  let k = 0, p = 1;
  do { k++; p *= Math.random(); } while (p > L);
  return k - 1;
}

function initMagnetometer() {
  if ('Magnetometer' in window) {
    try {
      const sensor = new Magnetometer({ frequency: 10 });
      sensor.addEventListener('reading', () => {
        currentUT = Math.hypot(sensor.x, sensor.y, sensor.z);
        sensorActive = true;
        updateSensorUI();
      });
      sensor.start();
      return;
    } catch (e) {
      console.log('Magnetometer API indisponível:', e);
    }
  }

  if (window.DeviceMotionEvent) {
    window.addEventListener('devicemotion', (e) => {
      if (e.magneticField && e.magneticField.x !== null) {
        currentUT = Math.hypot(e.magneticField.x, e.magneticField.y, e.magneticField.z);
        sensorActive = true;
        updateSensorUI();
      }
    });
  }
}

function updateSensorUI() {
  $('uTVal').textContent = currentUT.toFixed(1) + ' µT';
}

function readCPM() {
  const netUT = Math.max(0, currentUT - bgUT);
  const meanCPM = 40 + (netUT * 18);
  return poisson(meanCPM);
}

function setSignal(c) {
  $('bar').style.width = Math.min(100, 5 + 100 * c / 600) + '%';
  let t = c > 350 ? 'MUITO PRÓXIMO' : c > 200 ? 'APROXIMANDO-SE' : c > 90 ? 'SINAL DETECTÁVEL' : 'SINAL FRACO';
  $('signalText').textContent = t;
}

function soundClicks(c) {
  const n = Math.min(25, Math.max(1, Math.round(c / 35)));
  const box = $('clicks'); box.innerHTML = '';
  for (let i = 0; i < n; i++) {
    let d = document.createElement('span');
    d.className = 'dot';
    box.appendChild(d);
  }
  
  if (!window.AudioContext && !window.webkitAudioContext) return;
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!window._ac) window._ac = new AC();
    const ac = window._ac;
    if (ac.state === 'suspended') ac.resume();
    
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = 'square'; o.frequency.value = 1050;
    g.gain.value = .025;
    o.connect(g); g.connect(ac.destination);
    o.start(); o.stop(ac.currentTime + .025);
  } catch (e) {}
}

function measure() {
  if (!running) return;
  const c = readCPM();
  $('cpm').textContent = c;
  maxCPM = Math.max(maxCPM, c);
  $('max').textContent = maxCPM + ' CPM';
  setSignal(c);
  soundClicks(c);
}

function tick() {
  const s = Math.floor((Date.now() - startTime) / 1000), left = Math.max(0, 300 - s);
  $('timer').textContent = String(Math.floor(left / 60)).padStart(2, '0') + ':' + String(left % 60).padStart(2, '0');
  if (left === 0) {
    running = false;
    clearInterval(timerInt);
    clearInterval(autoMeasureInt);
    $('measure').disabled = true;
    $('signalText').textContent = 'TEMPO ESGOTADO';
  }
}

$('calibBtn').onclick = () => {
  bgUT = currentUT;
  $('bgVal').textContent = bgUT.toFixed(1) + ' µT';
  alert('Detector calibrado! Fundo ambiente ajustado para ' + bgUT.toFixed(1) + ' µT.');
};

$('start').onclick = () => {
  if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
    DeviceOrientationEvent.requestPermission().then(state => {
      if (state === 'granted') initMagnetometer();
    }).catch(console.error);
  } else {
    initMagnetometer();
  }

  if (running) return;
  running = true;
  startTime = Date.now();
  maxCPM = 0;
  $('max').textContent = '—';
  $('measure').disabled = false;
  $('signalText').textContent = 'DETECTOR ATIVO';
  
  measure();
  clearInterval(timerInt);
  clearInterval(autoMeasureInt);
  
  timerInt = setInterval(tick, 250);
  autoMeasureInt = setInterval(measure, 800);
};

$('measure').onclick = measure;
</script>
</body>
</html>
